## Build the docker image 
## Push the docker image to docker hub 
## SSH into our VM and start the new image
## Hello



name: Deploy the backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: mubumubu/todo-app-backend:${{ github.sha }}
      
      - name: Deploy to the VM
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/ssh_key
          chmod 600 ~/.ssh/ssh_key

          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/ssh_key \
            root@168.144.16.165 \
            "docker pull mubumubu/todo-app-backend:${{ github.sha }} &&
             docker rm -f user_backend1 || true
             docker run -d \
               --name user_backend1 \
               -p 8080:8080 \
               mubumubu/todo-app-backend:${{ github.sha }}"
