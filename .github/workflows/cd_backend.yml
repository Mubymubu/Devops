## Build the docker image 
## Push the docker image to docker hub 
## SSH into our VM and start the new image
## Hello



name: Deploy the backend

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: mubumubu/todo-app-backend:${{ github.sha }}
      - name: Deploy to the VM 
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key 
          chmod 700 /home/runner/ssh_key 
          ssh -o StrictHostKeyChecking=no -i ~/ssh_key root@168.144.16.165 -t "docker stop user_backend1 && docker run --name user_backend1 -d -p 8080:8080 mubumubu/todo-app-backend:${{ github.sha }}"
